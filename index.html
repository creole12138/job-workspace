<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>求职工作台</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: sticky top bar with module tabs; stats strip; view switcher; content. Cards only for applications. */
:root{
  --bg:#f4f7fb;--surface:#ffffff;--sunk:#eaf0f7;--fg:#16233a;--muted:#5f6d84;--line:#d9e2ee;
  --accent:#2563c9;--accent-soft:#e3edfb;--warn:#b7791f;--warn-soft:#fbf1df;--bad:#c0392b;--bad-soft:#fbe5e2;--good:#2f6b55;
  --sans:"Noto Sans SC",-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1520;--surface:#172031;--sunk:#1d283b;--fg:#e4ebf5;--muted:#93a1b8;--line:#2a3750;
  --accent:#7aa8f5;--accent-soft:#1e3257;--warn:#e0a948;--warn-soft:#3a2f1a;--bad:#ef7b6c;--bad-soft:#3d2220;--good:#7aa8f5;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1520;--surface:#172031;--sunk:#1d283b;--fg:#e4ebf5;--muted:#93a1b8;--line:#2a3750;
  --accent:#7aa8f5;--accent-soft:#1e3257;--warn:#e0a948;--warn-soft:#3a2f1a;--bad:#ef7b6c;--bad-soft:#3d2220;--good:#7aa8f5;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:14px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.hbar{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-block:12px}
h1{font-size:18px;margin:0;font-weight:700;letter-spacing:.02em}
.tabs{display:flex;gap:4px;background:var(--sunk);padding:3px;border-radius:8px}
.tabs button{border:0;background:none;padding:6px 14px;border-radius:6px;color:var(--muted);font:inherit;cursor:pointer}
.tabs button.on{background:var(--surface);color:var(--fg);font-weight:500;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.sync{margin-left:auto;font-size:12px;color:var(--muted)}
button,select,input,textarea{font:inherit;color:inherit}
.btn{border:1px solid var(--line);background:var(--surface);padding:6px 12px;border-radius:6px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--surface);font-weight:500}
.btn.sm{padding:3px 8px;font-size:12px}
.btn.del{color:var(--bad)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-block:18px 14px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:5px 12px;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--accent-soft);color:var(--accent);font-weight:500}
.spacer{flex:1}
/* stats */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) minmax(0,3fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-top:18px}
.stat{background:var(--surface);padding:12px 16px}
.stat b{display:block;font-family:var(--mono);font-size:24px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted);letter-spacing:.04em}
.funnel{display:flex;gap:4px;align-items:flex-end;flex-wrap:wrap}
.fstep{font-size:12px;color:var(--muted);white-space:nowrap}
.fstep em{font-style:normal;font-family:var(--mono);color:var(--fg)}
.arrow{color:var(--line)}
@media (max-width:760px){.stats{grid-template-columns:repeat(3,minmax(0,1fr))}.stats .stat.wide{grid-column:1/-1}}
/* alerts */
.alert{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:8px 12px;font-size:13px;margin-top:12px}
/* list */
.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px}
table{width:100%;border-collapse:collapse;min-width:720px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:500;letter-spacing:.04em;background:var(--sunk)}
tr:last-child td{border-bottom:0}
td.num{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.co{font-weight:700}
.sub{color:var(--muted);font-size:12px}
.chip{display:inline-block;font-size:12px;padding:1px 8px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.chip.stage{background:var(--accent-soft);color:var(--accent)}
.chip.stale{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.ex{background:transparent;border:1px dashed var(--line)}
/* kanban */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(220px,1fr);gap:10px;overflow-x:auto;padding-bottom:8px}
.col{background:var(--sunk);border-radius:10px;padding:8px;min-height:180px;display:flex;flex-direction:column;gap:8px}
.col.over{outline:2px dashed var(--accent)}
.col h3{font-size:13px;margin:4px 4px 2px;display:flex;justify-content:space-between;color:var(--muted);font-weight:500}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px;cursor:grab;display:flex;flex-direction:column;gap:6px}
.card.stale{border-color:var(--warn)}
.card .next{font-size:12px}
.card .acts{display:flex;gap:6px;flex-wrap:wrap}
/* calendar */
.cal-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.cal .dow{background:var(--sunk);font-size:12px;color:var(--muted);text-align:center;padding:6px 0}
.cell{background:var(--surface);min-height:96px;padding:6px;display:flex;flex-direction:column;gap:4px;min-width:0}
.cell.out{background:var(--bg);color:var(--muted)}
.cell.today .d{background:var(--accent);color:var(--surface);border-radius:999px;padding:0 6px}
.d{font-family:var(--mono);font-size:12px;align-self:flex-start}
.ev{font-size:11px;padding:2px 5px;border-radius:4px;background:var(--accent-soft);color:var(--accent);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;border:0;text-align:left}
.ev.clash{background:var(--bad-soft);color:var(--bad);font-weight:500}
@media (max-width:640px){.cell{min-height:64px;padding:3px}.ev{font-size:10px}}
.agenda{margin-top:14px;display:flex;flex-direction:column;gap:6px}
/* reviews */
.rv{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.rv-list{display:flex;flex-direction:column;gap:12px}
.q{border-left:2px solid var(--line);padding-left:10px;display:flex;flex-direction:column;gap:2px}
.q .lbl{font-size:12px;color:var(--muted)}
.q .weak{color:var(--bad)}
.improve{background:var(--accent-soft);color:var(--fg);border-radius:6px;padding:8px 10px;font-size:13px}
/* offer */
.score{font-family:var(--mono);font-weight:500;font-size:16px;color:var(--accent)}
.best td{background:var(--accent-soft)}
.note{font-size:12px;color:var(--muted);margin-top:8px}
/* modal */
.mask{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:20;display:flex;justify-content:center;align-items:flex-start;overflow-y:auto;padding:calc(24px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 24px max(12px,env(safe-area-inset-left,0px))}
.modal{background:var(--surface);border-radius:12px;width:min(640px,100%);padding:20px;display:flex;flex-direction:column;gap:14px}
.modal h2{margin:0;font-size:17px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:520px){.grid2{grid-template-columns:1fr}}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);min-width:0}
label.f input,label.f select,label.f textarea{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:7px 9px;font-size:14px;color:var(--fg);width:100%}
textarea{min-height:60px;resize:vertical}
.full{grid-column:1/-1}
.sublist{display:flex;flex-direction:column;gap:8px}
.subitem{border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:8px}
.empty{color:var(--muted);text-align:center;padding:40px 10px;background:var(--surface);border:1px dashed var(--line);border-radius:10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:8px;z-index:30;font-size:13px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<header><div class="wrap"><div class="hbar">
  <h1>求职工作台</h1>
  <nav class="tabs" id="tabs">
    <button data-t="apps" class="on">投递追踪</button>
    <button data-t="reviews">面试复盘</button>
    <button data-t="offers">Offer 对比</button>
  </nav>
  <span class="sync" id="sync">连接中…</span><button class="btn sm" id="logoutBtn" onclick="logout()" hidden>退出</button>
</div></div></header>

<main class="wrap" id="main"></main>
<div id="modalRoot"></div>
<div class="toast" id="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const STAGES=["已投递","简历评估","笔试","一面","二面","HR 面","Offer","未通过"];
const INTERVIEW_STAGES=["一面","二面","HR 面"];
const CHANNELS=["官网","内推","招聘平台"];
const EVTYPES=["笔试","一面","二面","HR 面","其他"];
const QTYPES=["专业题","行为题","案例题","背景题"];
const STALE_DAYS=7;
const S={tab:location.hash==="#reviews"?"reviews":location.hash==="#offers"?"offers":"apps",view:"list",calMonth:null,apps:[],reviews:[],offers:[],rvCo:"",rvType:"",editable:true};
try{S.view=localStorage.getItem("jd.view")||"list"}catch(e){}
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const todayStr=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const daysSince=d=>d?Math.floor((new Date(todayStr())-new Date(d.slice(0,10)))/864e5):0;
const fmtDT=s=>s?s.replace("T"," "):"";
const toast=m=>{const t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(t._h);t._h=setTimeout(()=>t.hidden=true,1800)};

/* ---------- storage: Supabase (table items: one row per record) ---------- */
const SB_URL="https://ezflzkzmdmrxaruflknc.supabase.co";
const SB_KEY="sb_publishable_GbGmniMN7jbSr7AghMXSaA_AwSr120s";
const sb=window.supabase.createClient(SB_URL,SB_KEY);
const COLS=["apps","reviews","offers"];let USER=null;
const setSync=t=>{$("#sync").textContent=t};
async function save(c,obj){
  obj.updatedAt=new Date().toISOString();
  const i=S[c].findIndex(x=>x.id===obj.id);i>=0?S[c][i]=obj:S[c].push(obj);render();
  const{error}=await sb.from("items").upsert({id:obj.id,kind:c,data:obj,user_id:USER.id},{onConflict:"user_id,id"});
  toast(error?"保存失败："+error.message:"已保存");
}
async function remove(c,id){
  S[c]=S[c].filter(x=>x.id!==id);render();
  const{error}=await sb.from("items").delete().eq("user_id",USER.id).eq("id",id);
  toast(error?"删除失败："+error.message:"已删除");
}
const newId=p=>p+"_"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
async function loadAll(){
  setSync("同步中…");
  const{data,error}=await sb.from("items").select("id,kind,data");
  if(error){setSync("读取失败："+error.message);return}
  COLS.forEach(c=>S[c]=data.filter(r=>r.kind===c).map(r=>({...r.data,id:r.id})));
  if(!data.some(r=>r.kind==="meta"))await seedExample();
  setSync("已同步 · "+(USER.email||""));render();
}
async function seedExample(){
  const ex=[
    {kind:"apps",data:{id:"app_example",example:true,company:"示例科技（虚构）",role:"AI 产品经理",city:"新加坡",channel:"内推",appliedAt:"2026-10-20",stage:"一面",nextStep:"一面：产品 sense + 项目深挖",nextAt:"2026-11-10T14:00",notes:"内推人：前同事；JD 侧重 Agent 落地",events:[{type:"笔试",at:"2026-10-24T10:00",dur:60},{type:"一面",at:"2026-11-10T14:00",dur:60}],history:["已投递","简历评估","笔试"],progressAt:"2026-10-27"}},
    {kind:"reviews",data:{id:"rv_example",example:true,appId:"app_example",round:"笔试",date:"2026-10-24",questions:[{type:"案例题",q:"为一款出海 AI 助手设计首月留存提升方案",answer:"先拆新用户激活路径，找到首个价值时刻，再设计引导和召回",weak:"没给出具体指标口径和实验设计"},{type:"行为题",q:"讲一次推动跨团队项目落地的经历",answer:"用 TikTok 项目举例，讲对齐目标和节奏",weak:"结果数据说得不够具体"}],improve:"案例题先说清目标指标和衡量方式；行为题准备 2 个带数字的 STAR 故事"}},
    {kind:"offers",data:{id:"of_example",example:true,company:"示例科技（虚构）",role:"AI 产品经理",city:"新加坡",currency:"SGD",monthly:"9000",months:"13",fundPct:"17",extraCash:"5000",intensity:3,growth:4,fit:4,perks:"每年 18 天年假，医疗保险，远程 2 天/周"}},
    {kind:"meta",data:{id:"meta_seeded"}}];
  const rows=ex.map(e=>({id:e.data.id,kind:e.kind,data:e.data,user_id:USER.id}));
  const{error}=await sb.from("items").upsert(rows,{onConflict:"user_id,id"});
  if(!error)ex.forEach(e=>{if(S[e.kind])S[e.kind].push(e.data)});
}
function showLogin(msg){
  $("#main").innerHTML=`<section class="rv" style="max-width:380px;margin:48px auto"><h2 style="margin:0;font-size:17px">登录求职工作台</h2>
  <label class="f">邮箱<input id="lg_email" type="email" autocomplete="email"></label>
  <label class="f">密码（至少 6 位）<input id="lg_pw" type="password" autocomplete="current-password"></label>
  <div class="row"><button class="btn pri" onclick="doLogin(false)">登录</button><button class="btn" onclick="doLogin(true)">首次使用：注册</button></div>
  <div class="sub" id="lg_msg">${esc(msg||"")}</div></section>`;
  setSync("未登录");
}
window.doLogin=async signup=>{
  const email=$("#lg_email").value.trim(),password=$("#lg_pw").value;
  const r=signup?await sb.auth.signUp({email,password,options:{emailRedirectTo:location.origin+location.pathname}}):await sb.auth.signInWithPassword({email,password});
  if(r.error){$("#lg_msg").textContent=r.error.message;return}
  if(signup&&!r.data.session){$("#lg_msg").textContent="已发送确认邮件，点邮件里的链接后回来登录。"}
};
window.logout=async()=>{await sb.auth.signOut()};
sb.auth.onAuthStateChange((ev,session)=>{
  const u=session?.user||null;
  if(u&&(!USER||USER.id!==u.id)){USER=u;$("#logoutBtn").hidden=false;render();loadAll()}
  else if(!u){USER=null;COLS.forEach(c=>S[c]=[]);$("#logoutBtn").hidden=true;showLogin()}
});
window.addEventListener("focus",()=>{if(USER&&!document.querySelector(".mask"))loadAll()});

/* ---------- tabs ---------- */
$("#tabs").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;S.tab=b.dataset.t;try{history.replaceState(null,"","#"+S.tab)}catch(_){}render()});

function render(){
  if(!USER)return;
  document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on",b.dataset.t===S.tab));
  $("#main").innerHTML=S.tab==="apps"?renderApps():S.tab==="reviews"?renderReviews():renderOffers();
}

/* ---------- applications ---------- */
const appLabel=a=>a?`${a.company}｜${a.role}`:"（已删除的投递）";
const isClosed=a=>a.stage==="Offer"||a.stage==="未通过";
const isStale=a=>!isClosed(a)&&daysSince(a.progressAt||a.appliedAt)>STALE_DAYS;
function reached(a,stage){const i=STAGES.indexOf(stage);const hist=a.history||[];if(STAGES.indexOf(a.stage)>=i&&a.stage!=="未通过")return true;return hist.some(h=>STAGES.indexOf(h)>=i&&h!=="未通过")}

function statsHTML(){
  const A=S.apps,n=A.length;
  const cnt=st=>A.filter(a=>reached(a,st)).length;
  const inter=A.filter(a=>INTERVIEW_STAGES.some(s=>reached(a,s))||a.stage==="Offer").length;
  const offer=A.filter(a=>a.stage==="Offer").length;
  const steps=STAGES.slice(0,7).map(st=>[st,cnt(st)]);
  const pct=(a,b)=>b?Math.round(a/b*100)+"%":"–";
  const funnel=steps.map(([st,c],i)=>(i?`<span class="arrow">→</span><span class="fstep"><em>${pct(c,steps[i-1][1])}</em></span><span class="arrow">→</span>`:"")+`<span class="fstep">${st} <em>${c}</em></span>`).join("");
  return `<section class="stats">
    <div class="stat"><b>${n}</b><span>投递</span></div>
    <div class="stat"><b>${inter}</b><span>进入面试 · ${pct(inter,n)}</span></div>
    <div class="stat"><b>${offer}</b><span>Offer · ${pct(offer,n)}</span></div>
    <div class="stat wide"><span>阶段转化率</span><div class="funnel">${funnel}</div></div>
  </section>`;
}
function renderApps(){
  const stale=S.apps.filter(isStale);
  let h=statsHTML();
  if(stale.length)h+=`<div class="alert">⏰ ${stale.length} 条投递超过 ${STALE_DAYS} 天没有进展：${stale.map(a=>esc(a.company)).join("、")}。可以跟进一下，或者更新状态。</div>`;
  h+=`<div class="toolbar"><div class="seg" id="viewSeg">${[["list","列表"],["board","看板"],["cal","日历"]].map(([k,t])=>`<button data-v="${k}" class="${S.view===k?"on":""}">${t}</button>`).join("")}</div><span class="spacer"></span><button class="btn pri" onclick="editApp()">＋ 新增投递</button></div>`;
  if(!S.apps.length)return h+`<div class="empty">还没有投递记录。点「新增投递」添加第一条。</div>`;
  h+=S.view==="board"?boardHTML():S.view==="cal"?calHTML():listHTML();
  return h;
}
document.addEventListener("click",e=>{const b=e.target.closest("#viewSeg button");if(b){S.view=b.dataset.v;try{localStorage.setItem("jd.view",S.view)}catch(_){}render()}});

const nextHTML=a=>a.nextStep?`${esc(a.nextStep)}${a.nextAt?` <span class="sub">· ${esc(fmtDT(a.nextAt))}</span>`:""}`:`<span class="sub">—</span>`;
const staleChip=a=>isStale(a)?`<span class="chip stale">${daysSince(a.progressAt||a.appliedAt)} 天无进展</span>`:"";
const rvCount=a=>S.reviews.filter(r=>r.appId===a.id).length;
const exChip=a=>a.example?`<span class="chip ex">示例</span>`:"";
function listHTML(){
  const rows=[...S.apps].sort((a,b)=>(b.appliedAt||"").localeCompare(a.appliedAt||"")).map(a=>`<tr>
    <td><div class="co">${esc(a.company)} ${exChip(a)}</div><div>${esc(a.role)}</div><div class="sub">${esc(a.city)}</div></td>
    <td><span class="chip ${a.stage==="未通过"?"bad":"stage"}">${esc(a.stage)}</span> ${staleChip(a)}</td>
    <td>${esc(a.channel)}</td><td class="num">${esc(a.appliedAt)}</td>
    <td>${nextHTML(a)}</td><td class="sub">${esc(a.notes)}</td>
    <td><div class="row"><button class="btn sm" onclick="editApp('${a.id}')">编辑</button><button class="btn sm" onclick="showCoReviews('${a.id}')">复盘 ${rvCount(a)}</button></div></td></tr>`).join("");
  return `<div class="tbl-wrap"><table><thead><tr><th>公司 / 岗位 / 城市</th><th>阶段</th><th>渠道</th><th>投递日期</th><th>下一步</th><th>备注</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`;
}
function boardHTML(){
  return `<div class="board">${STAGES.map(st=>{const list=S.apps.filter(a=>a.stage===st);
    return `<div class="col" data-stage="${st}" ondragover="event.preventDefault();this.classList.add('over')" ondragleave="this.classList.remove('over')" ondrop="dropCard(event,'${st}')"><h3><span>${st==="Offer"?"Offer":st}</span><span>${list.length}</span></h3>${list.map(cardHTML).join("")}</div>`}).join("")}</div>
  <p class="note">拖动卡片到其他列即可改阶段；手机上用卡片里的「下一阶段 →」。</p>`;
}
function cardHTML(a){
  const i=STAGES.indexOf(a.stage);const canNext=i<6;
  return `<div class="card ${isStale(a)?"stale":""}" draggable="true" ondragstart="event.dataTransfer.setData('text/plain','${a.id}')">
    <div><div class="co">${esc(a.company)} ${exChip(a)}</div><div class="sub">${esc(a.role)} · ${esc(a.city)}</div></div>
    <div class="next">${nextHTML(a)}</div>${staleChip(a)}
    <div class="acts">${canNext?`<button class="btn sm" onclick="moveStage('${a.id}','${STAGES[i+1]}')">下一阶段 →</button>`:""}<button class="btn sm" onclick="showCoReviews('${a.id}')">复盘 ${rvCount(a)}</button><button class="btn sm" onclick="editApp('${a.id}')">编辑</button></div></div>`;
}
window.dropCard=(e,st)=>{e.preventDefault();e.currentTarget.classList.remove("over");moveStage(e.dataTransfer.getData("text/plain"),st)};
window.moveStage=(id,st)=>{const a=S.apps.find(x=>x.id===id);if(!a||a.stage===st)return;const o=structuredClone(a);o.history=[...(o.history||[]),o.stage];o.stage=st;o.progressAt=todayStr();save("apps",o)};

/* calendar */
function allEvents(){const ev=[];S.apps.forEach(a=>(a.events||[]).forEach((e,i)=>{if(e.at)ev.push({...e,app:a,key:a.id+i,start:new Date(e.at),end:new Date(new Date(e.at).getTime()+(+e.dur||60)*6e4)})}));
  ev.forEach(x=>x.clash=ev.some(y=>y!==x&&x.start<y.end&&y.start<x.end));return ev}
function calHTML(){
  if(!S.calMonth){const d=new Date();S.calMonth=[d.getFullYear(),d.getMonth()]}
  const[y,m]=S.calMonth;const first=new Date(y,m,1);const start=new Date(y,m,1-((first.getDay()+6)%7));
  const ev=allEvents();const tStr=todayStr();let cells="";
  for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);
    const ds=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
    const day=ev.filter(e=>e.at.slice(0,10)===ds).sort((a,b)=>a.start-b.start);
    cells+=`<div class="cell ${d.getMonth()!==m?"out":""} ${ds===tStr?"today":""}"><span class="d">${d.getDate()}</span>${day.map(e=>`<button class="ev ${e.clash?"clash":""}" onclick="editApp('${e.app.id}')" title="${esc(e.app.company+" "+e.type+" "+fmtDT(e.at))}">${e.at.slice(11,16)} ${esc(e.app.company)} ${esc(e.type)}</button>`).join("")}</div>`;
    if(i===34&&new Date(start.getTime()+35*864e5).getMonth()!==m)break;}
  const upcoming=ev.filter(e=>e.end>=new Date()).sort((a,b)=>a.start-b.start);
  const clashN=upcoming.filter(e=>e.clash).length;
  return `<div class="cal-head"><button class="btn sm" onclick="calShift(-1)">←</button><b>${y} 年 ${m+1} 月</b><button class="btn sm" onclick="calShift(1)">→</button><button class="btn sm" onclick="S.calMonth=null;render()">本月</button></div>
  ${clashN?`<div class="alert" style="background:var(--bad-soft);color:var(--bad);margin:0 0 10px">有 ${clashN} 场笔试/面试时间重叠，已标红。</div>`:""}
  <div class="cal">${["一","二","三","四","五","六","日"].map(d=>`<div class="dow">${d}</div>`).join("")}${cells}</div>
  <div class="agenda"><b>接下来的安排</b>${upcoming.length?upcoming.map(e=>`<div class="row"><span class="num" style="font-family:var(--mono)">${fmtDT(e.at)}</span><span class="chip ${e.clash?"bad":"stage"}">${esc(e.type)}</span><span>${esc(appLabel(e.app))}</span><span class="sub">${e.dur||60} 分钟</span></div>`).join(""):`<span class="sub">暂无。在投递里添加笔试/面试时间即可显示。</span>`}</div>`;
}
window.calShift=d=>{let[y,m]=S.calMonth;m+=d;if(m<0){m=11;y--}if(m>11){m=0;y++}S.calMonth=[y,m];render()};

/* app modal */
let draft=null;
function openModal(html){$("#modalRoot").innerHTML=`<div class="mask" onclick="if(event.target===this)closeModal()"><div class="modal" role="dialog">${html}</div></div>`}
window.closeModal=()=>{$("#modalRoot").innerHTML="";draft=null};
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal()});
const opt=(arr,v)=>arr.map(x=>`<option ${x===v?"selected":""}>${x}</option>`).join("");
window.editApp=id=>{
  const a=id?structuredClone(S.apps.find(x=>x.id===id)):{id:newId("app"),company:"",role:"",city:"",channel:"官网",appliedAt:todayStr(),stage:"已投递",nextStep:"",nextAt:"",notes:"",events:[],history:[],progressAt:todayStr()};
  draft=a;drawAppModal(!id);
};
function drawAppModal(isNew){
  const a=draft;
  openModal(`<h2>${isNew?"新增投递":"编辑投递"}</h2>
  <div class="grid2">
    <label class="f">公司<input id="f_company" value="${esc(a.company)}"></label>
    <label class="f">岗位<input id="f_role" value="${esc(a.role)}"></label>
    <label class="f">城市<input id="f_city" value="${esc(a.city)}"></label>
    <label class="f">投递渠道<select id="f_channel">${opt(CHANNELS,a.channel)}</select></label>
    <label class="f">投递日期<input type="date" id="f_appliedAt" value="${esc(a.appliedAt)}"></label>
    <label class="f">阶段<select id="f_stage">${opt(STAGES,a.stage)}</select></label>
    <label class="f">下一步事项<input id="f_nextStep" value="${esc(a.nextStep)}"></label>
    <label class="f">下一步时间<input type="datetime-local" id="f_nextAt" value="${esc(a.nextAt)}"></label>
    <label class="f full">备注<textarea id="f_notes">${esc(a.notes)}</textarea></label>
  </div>
  <div><div class="row" style="justify-content:space-between"><b>笔试 / 面试安排</b><button class="btn sm" onclick="syncApp();draft.events.push({type:'一面',at:'',dur:60});drawAppModal(${isNew})">＋ 添加</button></div>
  <div class="sublist" style="margin-top:8px">${(a.events||[]).map((e,i)=>`<div class="row"><select id="ev_t${i}" class="btn sm">${opt(EVTYPES,e.type)}</select><input type="datetime-local" id="ev_a${i}" value="${esc(e.at)}" class="btn sm"><input type="number" id="ev_d${i}" value="${e.dur||60}" min="10" step="10" class="btn sm" style="width:72px"><span class="sub">分钟</span><button class="btn sm del" onclick="syncApp();draft.events.splice(${i},1);drawAppModal(${isNew})">删除</button></div>`).join("")||`<span class="sub">还没有安排。</span>`}</div></div>
  <div class="row">${isNew?"":`<button class="btn del" id="delBtn" onclick="confirmDel('apps','${a.id}',this)">删除</button>`}<span class="spacer"></span><button class="btn" onclick="closeModal()">取消</button><button class="btn pri" onclick="commitApp()">保存</button></div>`);
}
window.syncApp=()=>{const a=draft;["company","role","city","channel","appliedAt","stage","nextStep","nextAt","notes"].forEach(k=>{const el=$("#f_"+k);if(el)a[k]=el.value.trim()});
  (a.events||[]).forEach((e,i)=>{if($("#ev_t"+i)){e.type=$("#ev_t"+i).value;e.at=$("#ev_a"+i).value;e.dur=+$("#ev_d"+i).value||60}})};
window.commitApp=()=>{syncApp();const a=draft;if(!a.company){toast("请填写公司");return}
  const old=S.apps.find(x=>x.id===a.id);
  if(old&&old.stage!==a.stage){a.history=[...(a.history||[]),old.stage];a.progressAt=todayStr()}
  else if(old&&(old.nextStep!==a.nextStep||old.nextAt!==a.nextAt||JSON.stringify(old.events)!==JSON.stringify(a.events)))a.progressAt=todayStr();
  delete a.example;save("apps",a);closeModal()};
window.confirmDel=(c,id,btn)=>{if(btn.dataset.sure){remove(c,id);closeModal()}else{btn.dataset.sure=1;btn.textContent="再点一次确认删除"}};

/* reviews for one company */
window.showCoReviews=id=>{const a=S.apps.find(x=>x.id===id);const ids=S.apps.filter(x=>x.company===a.company).map(x=>x.id);
  const list=S.reviews.filter(r=>ids.includes(r.appId)).sort((x,y)=>(y.date||"").localeCompare(x.date||""));
  openModal(`<div class="row"><h2>${esc(a.company)} 的复盘</h2><span class="spacer"></span><button class="btn sm pri" onclick="editReview(null,'${a.id}')">＋ 写复盘</button><button class="btn sm" onclick="closeModal()">关闭</button></div>
  <div class="rv-list">${list.length?list.map(r=>reviewHTML(r,true)).join(""):`<div class="empty">这家公司还没有复盘。</div>`}</div>`)};

/* ---------- reviews ---------- */
function reviewHTML(r,compact){
  const a=S.apps.find(x=>x.id===r.appId);
  const qs=(r.questions||[]).filter(q=>!S.rvType||compact||q.type===S.rvType);
  return `<article class="rv"><div class="row"><b>${esc(appLabel(a))}</b><span class="chip stage">${esc(r.round)}</span><span class="sub num">${esc(r.date)}</span>${r.example?'<span class="chip ex">示例</span>':""}<span class="spacer"></span>${compact?"":`<button class="btn sm" onclick="editReview('${r.id}')">编辑</button>`}</div>
  ${qs.map(q=>`<div class="q"><div><span class="chip">${esc(q.type)}</span> <b>${esc(q.q)}</b></div>${q.answer?`<div><span class="lbl">我的回答要点：</span>${esc(q.answer)}</div>`:""}${q.weak?`<div class="weak"><span class="lbl">没答好：</span>${esc(q.weak)}</div>`:""}</div>`).join("")}
  ${r.improve?`<div class="improve"><b>下次改进：</b>${esc(r.improve)}</div>`:""}</article>`;
}
function renderReviews(){
  const cos=[...new Set(S.apps.map(a=>a.company))];
  let list=S.reviews.filter(r=>{const a=S.apps.find(x=>x.id===r.appId);if(S.rvCo&&a?.company!==S.rvCo)return false;if(S.rvType&&!(r.questions||[]).some(q=>q.type===S.rvType))return false;return true}).sort((x,y)=>(y.date||"").localeCompare(x.date||""));
  return `<div class="toolbar"><select class="btn" id="rvCo" onchange="S.rvCo=this.value;render()"><option value="">全部公司</option>${cos.map(c=>`<option ${c===S.rvCo?"selected":""}>${esc(c)}</option>`).join("")}</select>
  <div class="seg">${["",...QTYPES].map(t=>`<button class="${S.rvType===t?"on":""}" onclick="S.rvType='${t}';render()">${t||"全部题型"}</button>`).join("")}</div>
  <span class="spacer"></span><button class="btn pri" onclick="editReview()" ${S.apps.length?"":"disabled"}>＋ 写复盘</button></div>
  <div class="rv-list">${list.length?list.map(r=>reviewHTML(r)).join(""):`<div class="empty">${S.reviews.length?"没有符合筛选的复盘。":"还没有复盘。面试结束后点「写复盘」，关联到对应的投递。"}</div>`}</div>`;
}
window.editReview=(id,appId)=>{
  draft=id?structuredClone(S.reviews.find(r=>r.id===id)):{id:newId("rv"),appId:appId||S.apps[0]?.id||"",round:"一面",date:todayStr(),questions:[{type:"专业题",q:"",answer:"",weak:""}],improve:""};
  drawReview(!id)};
function drawReview(isNew){const r=draft;
  openModal(`<h2>${isNew?"写复盘":"编辑复盘"}</h2><div class="grid2">
  <label class="f full">关联投递<select id="r_app">${S.apps.map(a=>`<option value="${a.id}" ${a.id===r.appId?"selected":""}>${esc(appLabel(a))}</option>`).join("")}</select></label>
  <label class="f">轮次<select id="r_round">${opt(["笔试","一面","二面","三面","HR 面","其他"],r.round)}</select></label>
  <label class="f">日期<input type="date" id="r_date" value="${esc(r.date)}"></label></div>
  <div class="row" style="justify-content:space-between"><b>被问到的问题</b><button class="btn sm" onclick="syncRv();draft.questions.push({type:'专业题',q:'',answer:'',weak:''});drawReview(${isNew})">＋ 添加问题</button></div>
  <div class="sublist">${r.questions.map((q,i)=>`<div class="subitem"><div class="row"><select id="q_t${i}" class="btn sm">${opt(QTYPES,q.type)}</select><span class="spacer"></span><button class="btn sm del" onclick="syncRv();draft.questions.splice(${i},1);drawReview(${isNew})">删除</button></div>
   <label class="f">问题<input id="q_q${i}" value="${esc(q.q)}"></label><label class="f">我的回答要点<textarea id="q_a${i}">${esc(q.answer)}</textarea></label><label class="f">没答好的地方<textarea id="q_w${i}">${esc(q.weak)}</textarea></label></div>`).join("")}</div>
  <label class="f">下一次改进点<textarea id="r_improve">${esc(r.improve)}</textarea></label>
  <div class="row">${isNew?"":`<button class="btn del" onclick="confirmDel('reviews','${r.id}',this)">删除</button>`}<span class="spacer"></span><button class="btn" onclick="closeModal()">取消</button><button class="btn pri" onclick="commitRv()">保存</button></div>`)}
window.syncRv=()=>{const r=draft;r.appId=$("#r_app").value;r.round=$("#r_round").value;r.date=$("#r_date").value;r.improve=$("#r_improve").value.trim();
  r.questions.forEach((q,i)=>{q.type=$("#q_t"+i).value;q.q=$("#q_q"+i).value.trim();q.answer=$("#q_a"+i).value.trim();q.weak=$("#q_w"+i).value.trim()})};
window.commitRv=()=>{syncRv();if(!draft.appId){toast("先添加一条投递");return}delete draft.example;save("reviews",draft);closeModal()};

/* ---------- offers ---------- */
const CUR={SGD:"S$",CNY:"¥",USD:"$"};
function offerCalc(o){
  const base=(+o.monthly||0)*(+o.months||0);
  const fund=o.currency==="CNY"?(+o.monthly||0)*((+o.fundPct||0)/100)*12*2:(+o.monthly||0)*((+o.fundPct||0)/100)*12;
  const total=base+(+o.extraCash||0);
  const score=Math.round(((+o.growth||0)*0.4+(6-(+o.intensity||3))*0.3+(+o.fit||0)*0.3)*20);
  return{base,fund,total,score};
}
const money=(v,c)=>(CUR[c]||"")+Math.round(v).toLocaleString();
function renderOffers(){
  const rows=S.offers.map(o=>({o,c:offerCalc(o)}));
  const best=rows.length>1?rows.reduce((a,b)=>b.c.score>a.c.score?b:a).o.id:null;
  return `<div class="toolbar"><b>Offer 对比</b><span class="spacer"></span><button class="btn pri" onclick="editOffer()">＋ 新增 Offer</button></div>
  ${rows.length?`<div class="tbl-wrap"><table style="min-width:960px"><thead><tr><th>公司 / 岗位</th><th>城市</th><th>月薪 × 月数</th><th>年包（现金）</th><th>公积金/CPF 比例</th><th>工作强度</th><th>成长空间</th><th>其他福利</th><th>综合分</th><th></th></tr></thead><tbody>
  ${rows.map(({o,c})=>`<tr class="${o.id===best?"best":""}"><td><div class="co">${esc(o.company)} ${o.example?'<span class="chip ex">示例</span>':""}</div><div class="sub">${esc(o.role)}</div></td><td>${esc(o.city)}</td>
  <td class="num">${money(o.monthly,o.currency)} × ${esc(o.months)}</td><td class="num"><b>${money(c.total,o.currency)}</b>${+o.extraCash?`<div class="sub">含签字费/其他 ${money(o.extraCash,o.currency)}</div>`:""}</td>
  <td class="num">${esc(o.fundPct)}%<div class="sub">约 ${money(c.fund,o.currency)}/年</div></td><td>${"●".repeat(+o.intensity||0)}<span class="sub">${"○".repeat(5-(+o.intensity||0))}</span></td><td>${"●".repeat(+o.growth||0)}<span class="sub">${"○".repeat(5-(+o.growth||0))}</span></td>
  <td class="sub">${esc(o.perks)}</td><td><span class="score">${c.score}</span></td><td><button class="btn sm" onclick="editOffer('${o.id}')">编辑</button></td></tr>`).join("")}</tbody></table></div>
  <p class="note">年包 = 月薪 × 月数 + 签字费/其他现金。公积金按人民币口径计个人+公司两份，新加坡 CPF 只计公司部分。综合分（满分 100）= 成长空间 40% + 工作强度（越低越好）30% + 个人匹配度 30%。不同币种的年包不直接比较。</p>`
  :`<div class="empty">还没有 Offer。拿到后点「新增 Offer」记录。</div>`}`;
}
window.editOffer=id=>{const o=id?structuredClone(S.offers.find(x=>x.id===id)):{id:newId("of"),company:"",role:"",city:"",currency:"SGD",monthly:"",months:13,fundPct:17,extraCash:0,intensity:3,growth:3,fit:3,perks:""};
  draft=o;
  openModal(`<h2>${id?"编辑 Offer":"新增 Offer"}</h2><div class="grid2">
  <label class="f">公司<input id="o_company" value="${esc(o.company)}"></label><label class="f">岗位<input id="o_role" value="${esc(o.role)}"></label>
  <label class="f">城市<input id="o_city" value="${esc(o.city)}"></label><label class="f">币种<select id="o_currency">${opt(["SGD","CNY","USD"],o.currency)}</select></label>
  <label class="f">月薪<input type="number" id="o_monthly" value="${esc(o.monthly)}"></label><label class="f">月数<input type="number" step="0.5" id="o_months" value="${esc(o.months)}"></label>
  <label class="f">公积金 / CPF 比例 %<input type="number" step="0.5" id="o_fundPct" value="${esc(o.fundPct)}"></label><label class="f">签字费 / 其他现金（年）<input type="number" id="o_extraCash" value="${esc(o.extraCash)}"></label>
  <label class="f">工作强度 1–5（5 最累）<input type="number" min="1" max="5" id="o_intensity" value="${esc(o.intensity)}"></label><label class="f">成长空间 1–5<input type="number" min="1" max="5" id="o_growth" value="${esc(o.growth)}"></label>
  <label class="f">个人匹配度 1–5<input type="number" min="1" max="5" id="o_fit" value="${esc(o.fit)}"></label>
  <label class="f full">其他福利<textarea id="o_perks">${esc(o.perks)}</textarea></label></div>
  <div class="row">${id?`<button class="btn del" onclick="confirmDel('offers','${o.id}',this)">删除</button>`:""}<span class="spacer"></span><button class="btn" onclick="closeModal()">取消</button><button class="btn pri" onclick="commitOffer()">保存</button></div>`)};
window.commitOffer=()=>{const o=draft;["company","role","city","currency","monthly","months","fundPct","extraCash","intensity","growth","fit","perks"].forEach(k=>o[k]=$("#o_"+k).value.trim());
  ["intensity","growth","fit"].forEach(k=>o[k]=Math.min(5,Math.max(1,+o[k]||3)));if(!o.company){toast("请填写公司");return}delete o.example;save("offers",o);closeModal()};
</script>
