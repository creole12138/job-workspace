<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>求职工作台</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Outfit:wght@400;500;600&display=swap">
<style>
/* Layout: sage canvas, white rounded cards in a bento grid; black pills for primary actions, lime for "now/active". */
:root{
  --bg:#e9ece6;--surface:#ffffff;--sunk:#f2f4ef;--fg:#16181a;--muted:#7b817a;--line:#e1e5dd;
  --ink:#16181a;--on-ink:#ffffff;--lime:#ddf26b;--on-lime:#16181a;--sage:#a9b4a6;--sage-deep:#7d8a7a;
  --accent:#16181a;--accent-soft:#eef7c4;
  --warn:#b7791f;--warn-soft:#fbf0d9;--bad:#cc5b4f;--bad-soft:#f8e1dd;--good:#4a9a63;--good-soft:#dff0e3;
  --night:#1f2321;--on-night:#eef0ec;--night-2:#3a413c;--r-lg:26px;--r-md:18px;--r-sm:12px;
  --sans:"Noto Sans SC",-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  --num:"Outfit","Noto Sans SC",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111312;--surface:#1c1f1d;--sunk:#252926;--fg:#eef0ec;--muted:#959c94;--line:#2c312d;
  --ink:#eef0ec;--on-ink:#16181a;--lime:#d4ea5c;--on-lime:#16181a;--sage:#5d6a5b;--sage-deep:#86937f;
  --accent:#eef0ec;--accent-soft:#33391f;--night:#262b28;--on-night:#eef0ec;--night-2:#353b37;--warn:#e0a948;--warn-soft:#3a2f1a;--bad:#ef8a7c;--bad-soft:#3d2421;--good:#7fcf95;--good-soft:#1f3326;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111312;--surface:#1c1f1d;--sunk:#252926;--fg:#eef0ec;--muted:#959c94;--line:#2c312d;
  --ink:#eef0ec;--on-ink:#16181a;--lime:#d4ea5c;--on-lime:#16181a;--sage:#5d6a5b;--sage-deep:#86937f;
  --accent:#eef0ec;--accent-soft:#33391f;--night:#262b28;--on-night:#eef0ec;--night-2:#353b37;--warn:#e0a948;--warn-soft:#3a2f1a;--bad:#ef8a7c;--bad-soft:#3d2421;--good:#7fcf95;--good-soft:#1f3326;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:14px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1200px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 56px}
header .wrap{padding-block:0}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg)}
.hbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:14px}
h1{font-size:20px;margin:0;font-weight:700;letter-spacing:.01em}
.tabs{display:flex;gap:6px}
.tabs button{border:0;background:var(--surface);padding:8px 16px;border-radius:999px;color:var(--fg);font:inherit;cursor:pointer}
.tabs button.on{background:var(--ink);color:var(--on-ink);font-weight:500}
.sync{margin-left:auto;font-size:12px;color:var(--muted);background:var(--surface);padding:6px 12px;border-radius:999px}
button,select,input,textarea{font:inherit;color:inherit}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 16px;border-radius:999px;cursor:pointer}
.btn:hover{border-color:var(--fg)}
.btn.pri{background:var(--ink);border-color:var(--ink);color:var(--on-ink);font-weight:500}
.btn.sm{padding:4px 12px;font-size:12px}
.btn.del{color:var(--bad)}
.btn:disabled{opacity:.5;cursor:default}
:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-block:20px 14px}
.seg{display:inline-flex;gap:4px;background:var(--surface);padding:4px;border-radius:999px}
.seg button{border:0;background:none;padding:6px 14px;border-radius:999px;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--lime);color:var(--on-lime);font-weight:500}
.spacer{flex:1}
/* bento overview */
.bento{display:grid;grid-auto-flow:dense;grid-template-columns:repeat(12,minmax(0,1fr));gap:12px;margin-top:6px}
.tile{background:var(--surface);border-radius:var(--r-lg);padding:18px 20px;display:flex;flex-direction:column;gap:10px;min-width:0}
.tile.lime{background:var(--lime);color:var(--on-lime)}
.tile.ink{background:var(--ink);color:var(--on-ink)}
.tile.sage{background:var(--sage);color:var(--on-lime)}
.t-kpi{grid-column:span 2}
.t-funnel{grid-column:span 6;grid-row:span 2}
.t-donut{grid-column:span 6}
.t-week{grid-column:1/-1}
@media (max-width:900px){.t-kpi{grid-column:span 4}.t-funnel,.t-donut{grid-column:1/-1;grid-row:auto}}
.lbl{font-size:12px;opacity:.7;letter-spacing:.02em}
.big{font-family:var(--num);font-size:40px;line-height:1;font-weight:500;font-variant-numeric:tabular-nums}
.big small{font-size:15px;opacity:.6;margin-left:4px}
.icon{width:34px;height:34px;border-radius:999px;background:var(--surface);color:var(--fg);display:grid;place-items:center;flex:none}
.tile.ink .icon{background:var(--lime);color:var(--on-lime)}
.icon svg{width:16px;height:16px}
.donut-wrap{display:flex;align-items:center;gap:14px}
.donut-wrap svg{width:110px;height:110px;flex:none}
.legend{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 16px;font-size:12px;min-width:0;flex:1}
.legend .li{display:flex;flex-direction:column;gap:3px;min-width:0}
.legend .li span{color:var(--muted)}
.legend .li b{font-family:var(--num);font-size:17px;font-weight:500}
.legend .mini{height:4px;border-radius:999px;background:var(--sunk);overflow:hidden}
.legend .mini i{display:block;height:100%;border-radius:999px}
.vbars{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;align-items:end;flex:1;min-height:170px}
.vbar{display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;min-width:0}
.vbar .track{flex:1;width:100%;max-width:44px;background:var(--sunk);border-radius:14px;position:relative;overflow:hidden;min-height:120px}
.vbar .fill{position:absolute;left:0;right:0;bottom:0;background:var(--ink);border-radius:14px;min-height:6px}
.vbar.last .fill{background:var(--lime)}
.vbar .val{font-family:var(--num);font-weight:500;font-size:15px}
.vbar .pct{font-size:11px;color:var(--muted);font-family:var(--num)}
.vbar .nm{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.day{background:var(--sunk);border-radius:999px;padding:10px 0 12px;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.day b{font-family:var(--num);font-size:18px;font-weight:500}
.day span{font-size:11px;color:var(--muted)}
.day.today{background:var(--lime);color:var(--on-lime)}
.day.today span{color:var(--on-lime);opacity:.7}
.dots{display:flex;gap:3px;height:6px}
.dots i{width:6px;height:6px;border-radius:999px;background:var(--ink)}
.dots i.clash{background:var(--bad)}
/* alerts */
.alert{display:flex;gap:10px;align-items:center;background:var(--warn-soft);color:var(--warn);border-radius:var(--r-md);padding:10px 14px;font-size:13px;margin-top:12px}
.alert.badc{background:var(--bad-soft);color:var(--bad)}
/* application cards (list view) */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.acard{background:var(--surface);border-radius:var(--r-lg);padding:16px 18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.acard.stale{box-shadow:inset 0 0 0 2px var(--warn)}
.ahead{display:flex;gap:10px;align-items:center}
.avatar{width:38px;height:38px;border-radius:999px;background:var(--sunk);display:grid;place-items:center;font-weight:700;flex:none}
.co{font-weight:700}
.sub{color:var(--muted);font-size:12px}
.prog{display:flex;gap:3px}
.prog i{flex:1;height:6px;border-radius:999px;background:var(--sunk)}
.prog i.on{background:var(--ink)}
.prog.bad i.on{background:var(--bad)}
.prog.offer i.on{background:var(--good)}
.nextbox{background:var(--sunk);border-radius:var(--r-sm);padding:8px 10px;font-size:13px;display:flex;gap:8px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:2px 10px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.chip.stage{background:var(--accent-soft);color:var(--fg)}
.chip.stale{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.good{background:var(--good-soft);color:var(--good)}
.chip.ex{background:transparent;border:1px dashed var(--line)}
.acts{display:flex;gap:6px;flex-wrap:wrap}
/* kanban */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(230px,1fr);gap:12px;overflow-x:auto;padding-bottom:8px}
.col{background:var(--sunk);border-radius:var(--r-lg);padding:10px;min-height:200px;display:flex;flex-direction:column;gap:10px}
.col.over{outline:2px dashed var(--fg)}
.col h3{font-size:13px;margin:4px 6px 0;display:flex;justify-content:space-between;align-items:center;font-weight:500}
.col h3 span:last-child{background:var(--surface);border-radius:999px;padding:0 8px;font-family:var(--num)}
.card{background:var(--surface);border-radius:var(--r-md);padding:12px;cursor:grab;display:flex;flex-direction:column;gap:8px}
.card.stale{box-shadow:inset 0 0 0 2px var(--warn)}
.card .next{font-size:12px}
/* calendar */
.calgrid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:12px;align-items:start}
@media (max-width:820px){.calgrid{grid-template-columns:1fr}}
.calbox{background:var(--night);color:var(--on-night);border-radius:var(--r-lg);padding:20px}
.cal-head{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.cal-head b{font-size:16px;font-weight:500;flex:1}
.calbox .btn{background:var(--night-2);border-color:transparent;color:var(--on-night)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px 4px;justify-items:center}
.cal .dow{font-size:11px;opacity:.55;padding:2px 0 6px}
.dc{width:38px;height:38px;border-radius:999px;border:0;background:none;color:inherit;font-family:var(--num);font-size:13px;display:grid;place-items:center;cursor:pointer;position:relative;padding:0}
.dc.out{opacity:.3}
.dc.today{box-shadow:inset 0 0 0 1.5px var(--on-night)}
.dc.past{background:var(--night-2)}
.dc.up{background:var(--lime);color:#16181a;font-weight:600}
.dc.clash{background:var(--bad);color:#fff;font-weight:600}
.dc.sel{outline:2px solid var(--lime);outline-offset:2px}
.dc .n{position:absolute;top:-3px;right:-3px;background:var(--on-night);color:var(--night);border-radius:999px;font-size:9px;min-width:14px;height:14px;line-height:14px;padding:0 3px}
@media (max-width:420px){.dc{width:32px;height:32px;font-size:12px}}
.calleg{display:flex;gap:14px;flex-wrap:wrap;margin-top:14px;font-size:11px;opacity:.75}
.calleg i{display:inline-block;width:8px;height:8px;border-radius:999px;margin-right:5px;vertical-align:middle}
.meet{background:var(--surface);border-radius:var(--r-lg);padding:20px;display:flex;flex-direction:column;gap:4px}
.meet h3{margin:0 0 8px;font-size:16px;font-weight:500;display:flex;gap:8px;align-items:center}
.mrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 0;border-top:1px solid var(--line);cursor:pointer}
.mrow:first-of-type{border-top:0}
.mrow .t{font-family:var(--num);font-size:24px;font-weight:500;line-height:1}
.mrow .t small{display:block;font-size:11px;color:var(--muted);font-weight:400;margin-top:4px}
.mrow.clash .t{color:var(--bad)}
.mono{font-family:var(--num);font-variant-numeric:tabular-nums}
/* reviews */
.rv{background:var(--surface);border-radius:var(--r-lg);padding:18px 20px;display:flex;flex-direction:column;gap:12px}
.rv-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px}
.modal .rv-list{grid-template-columns:1fr}
@media (max-width:420px){.rv-list{grid-template-columns:1fr}}
.q{background:var(--sunk);border-radius:var(--r-sm);padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.q .qlbl{font-size:12px;color:var(--muted)}
.q .weak{color:var(--bad)}
.improve{background:var(--lime);color:var(--on-lime);border-radius:var(--r-sm);padding:10px 12px;font-size:13px}
.qmix{display:flex;height:8px;border-radius:999px;overflow:hidden;gap:2px}
/* offers */
.ocards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.ocard{background:var(--surface);border-radius:var(--r-lg);padding:18px 20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.ocard.best{background:var(--lime);color:var(--on-lime)}
.ocard.best .sub,.ocard.best .lbl{color:var(--on-lime)}
.ocard .ring{width:64px;height:64px;flex:none}
.meter{display:grid;grid-template-columns:64px minmax(0,1fr);gap:8px;align-items:center;font-size:12px}
.meter .pips{display:flex;gap:4px}
.meter .pips i{flex:1;height:8px;border-radius:999px;background:var(--sunk)}
.ocard.best .meter .pips i{background:rgba(0,0,0,.1)}
.meter .pips i.on{background:var(--ink)}
.ocard.best .meter .pips i.on{background:#16181a}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.kv div{background:var(--sunk);border-radius:var(--r-sm);padding:8px 10px;min-width:0}
.ocard.best .kv div{background:rgba(255,255,255,.45)}
.kv b{display:block;font-family:var(--num);font-size:17px;font-weight:500}
.note{font-size:12px;color:var(--muted);margin-top:10px}
/* modal */
.mask{position:fixed;inset:0;background:rgba(20,24,22,.4);z-index:20;display:flex;justify-content:center;align-items:flex-start;overflow-y:auto;padding:calc(24px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 24px max(12px,env(safe-area-inset-left,0px))}
.modal{background:var(--surface);border-radius:var(--r-lg);width:min(640px,100%);padding:22px;display:flex;flex-direction:column;gap:14px}
.modal h2{margin:0;font-size:18px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:520px){.grid2{grid-template-columns:1fr}}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);min-width:0}
label.f input,label.f select,label.f textarea{border:1px solid transparent;background:var(--sunk);border-radius:var(--r-sm);padding:9px 12px;font-size:14px;color:var(--fg);width:100%}
label.f input:focus,label.f select:focus,label.f textarea:focus{border-color:var(--fg);outline:none}
textarea{min-height:64px;resize:vertical}
.full{grid-column:1/-1}
.sublist{display:flex;flex-direction:column;gap:8px}
.subitem{background:var(--sunk);border-radius:var(--r-md);padding:12px;display:flex;flex-direction:column;gap:8px}
.subitem label.f input,.subitem label.f textarea{background:var(--surface)}
.empty{color:var(--muted);text-align:center;padding:44px 16px;background:var(--surface);border-radius:var(--r-lg);display:flex;flex-direction:column;align-items:center;gap:10px}
.empty svg{width:44px;height:44px;opacity:.5}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--on-ink);padding:10px 16px;border-radius:999px;z-index:30;font-size:13px}
.login{max-width:400px;margin:48px auto}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<header><div class="wrap"><div class="hbar">
  <h1>求职工作台</h1>
  <nav class="tabs" id="tabs">
    <button data-t="apps" class="on">投递追踪</button>
    <button data-t="reviews">面试复盘</button>
    <button data-t="offers">Offer 对比</button>
  </nav>
  <span class="sync" id="sync">连接中…</span><button class="btn sm" id="logoutBtn" onclick="logout()" hidden>退出</button>
</div></div></header>

<main class="wrap" id="main"></main>
<div id="modalRoot"></div>
<div class="toast" id="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const STAGES=["已投递","简历评估","笔试","一面","二面","HR 面","Offer","未通过"];
const INTERVIEW_STAGES=["一面","二面","HR 面"];
const CHANNELS=["官网","内推","招聘平台"];
const EVTYPES=["笔试","一面","二面","HR 面","其他"];
const QTYPES=["专业题","行为题","案例题","背景题"];
const STALE_DAYS=7;
const S={tab:location.hash==="#reviews"?"reviews":location.hash==="#offers"?"offers":"apps",view:"list",calMonth:null,apps:[],reviews:[],offers:[],rvCo:"",rvType:"",editable:true};
try{S.view=localStorage.getItem("jd.view")||"list"}catch(e){}
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const todayStr=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const daysSince=d=>d?Math.floor((new Date(todayStr())-new Date(d.slice(0,10)))/864e5):0;
const fmtDT=s=>s?s.replace("T"," "):"";
const toast=m=>{const t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(t._h);t._h=setTimeout(()=>t.hidden=true,1800)};

/* ---------- storage: Supabase (owner) or in-page demo data ---------- */
const SB_URL="https://ezflzkzmdmrxaruflknc.supabase.co";
const SB_KEY="sb_publishable_GbGmniMN7jbSr7AghMXSaA_AwSr120s";
const sb=window.supabase.createClient(SB_URL,SB_KEY);
const HOME=location.origin+location.pathname;
const COLS=["apps","reviews","offers"];let USER=null,DEMO=false;
const setSync=t=>{$("#sync").textContent=t};
function setHeader(){$("#logoutBtn").hidden=!(USER||DEMO);$("#logoutBtn").textContent=DEMO?"退出示例":"退出登录"}
async function save(c,obj){
  obj.updatedAt=new Date().toISOString();
  const i=S[c].findIndex(x=>x.id===obj.id);i>=0?S[c][i]=obj:S[c].push(obj);render();
  if(DEMO){toast("示例模式：改动不会保存");return}
  const{error}=await sb.from("items").upsert({id:obj.id,kind:c,data:obj,user_id:USER.id},{onConflict:"user_id,id"});
  toast(error?"保存失败："+error.message:"已保存");
}
async function remove(c,id){
  S[c]=S[c].filter(x=>x.id!==id);render();
  if(DEMO){toast("示例模式：改动不会保存");return}
  const{error}=await sb.from("items").delete().eq("user_id",USER.id).eq("id",id);
  toast(error?"删除失败："+error.message:"已删除");
}
const newId=p=>p+"_"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
async function loadAll(){
  setSync("同步中…");
  const{data,error}=await sb.from("items").select("id,kind,data");
  if(error){setSync("读取失败："+error.message);return}
  COLS.forEach(c=>S[c]=data.filter(r=>r.kind===c).map(r=>({...r.data,id:r.id})));
  setSync("已同步 · "+(USER.email||""));render();
}
/* demo data: fictional, dates relative to today */
function dshift(n,t){const d=new Date();d.setDate(d.getDate()+n);const s=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");return t?s+"T"+t:s}

/* ---------- tabs ---------- */
$("#tabs").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;S.tab=b.dataset.t;try{history.replaceState(null,"","#"+S.tab)}catch(_){}render()});

function render(){
  if(!USER&&!DEMO||RESETTING)return;

  $("#main").innerHTML=S.tab==="apps"?renderApps():S.tab==="reviews"?renderReviews():renderOffers();

/* ---------- applications ---------- */
const appLabel=a=>a?`${a.company}｜${a.role}`:"（已删除的投递）";
const isClosed=a=>a.stage==="Offer"||a.stage==="未通过";
const isStale=a=>!isClosed(a)&&daysSince(a.progressAt||a.appliedAt)>STALE_DAYS;
function reached(a,stage){const i=STAGES.indexOf(stage);const hist=a.history||[];if(STAGES.indexOf(a.stage)>=i&&a.stage!=="未通过")return true;return hist.some(h=>STAGES.indexOf(h)>=i&&h!=="未通过")}

document.addEventListener("click",e=>{const b=e.target.closest("#viewSeg button");if(b){S.view=b.dataset.v;try{localStorage.setItem("jd.view",S.view)}catch(_){}render()}});

const staleChip=a=>isStale(a)?`<span class="chip stale">${daysSince(a.progressAt||a.appliedAt)} 天无进展</span>`:"";
const rvCount=a=>S.reviews.filter(r=>r.appId===a.id).length;

const STAGE_COLOR={"已投递":"var(--sage)","简历评估":"var(--sage-deep)","笔试":"#c9d6c3","一面":"var(--lime)","二面":"#b9cf4a","HR 面":"#8fa83a","Offer":"var(--good)","未通过":"var(--bad)"};
function donut(parts,size,center,sub){ // parts:[{v,c}]
  const r=40,C=2*Math.PI*r,tot=parts.reduce((s,p)=>s+p.v,0)||1;let off=0;
  const segs=parts.filter(p=>p.v>0).map(p=>{const len=p.v/tot*C;const g=parts.filter(x=>x.v>0).length>1?2:0;const s=`<circle cx="50" cy="50" r="${r}" fill="none" stroke="${p.c}" stroke-width="9" stroke-linecap="round" stroke-dasharray="${Math.max(len-g,0.01)} ${C}" stroke-dashoffset="${-off}" transform="rotate(-90 50 50)"/>`;off+=len;return s}).join("");
  return `<svg viewBox="0 0 100 100" style="width:${size}px;height:${size}px" role="img"><circle cx="50" cy="50" r="${r}" fill="none" stroke="var(--sunk)" stroke-width="9"/>${segs}<text x="50" y="${sub?50:56}" text-anchor="middle" font-family="Outfit,sans-serif" font-size="22" font-weight="500" fill="currentColor">${center}</text>${sub?`<text x="50" y="66" text-anchor="middle" font-size="10" fill="currentColor" opacity=".6">${sub}</text>`:""}</svg>`;
}
const avatarOf=s=>esc((s||"?").trim().charAt(0));
const emptyBox=t=>`<div class="empty">${ICON.folder}<div>${t}</div></div>`;

function statsHTML(){
  const A=S.apps,n=A.length;
  const cnt=st=>A.filter(a=>reached(a,st)).length;
  const inter=A.filter(a=>INTERVIEW_STAGES.some(s=>reached(a,s))||a.stage==="Offer").length;
  const offer=A.filter(a=>a.stage==="Offer").length;
  const pct=(a,b)=>b?Math.round(a/b*100)+"%":"–";
  const steps=STAGES.slice(0,7).map(st=>[st,cnt(st)]);
  const funnel=steps.map(([st,c],i)=>`<div class="vbar ${i===6?"last":""}" title="${st}：${c}，较上一阶段 ${i?pct(c,steps[i-1][1]):"100%"}"><span class="val">${c}</span><div class="track"><div class="fill" style="height:${n?c/n*100:0}%"></div></div><span class="pct">${i?pct(c,steps[i-1][1]):"—"}</span><span class="nm">${st==="简历评估"?"简历":st}</span></div>`).join("");
  const byStage=STAGES.map(st=>({st,v:A.filter(a=>a.stage===st).length,c:STAGE_COLOR[st]}));
  // this week strip
  const ev=allEvents();const base=new Date();base.setHours(0,0,0,0);base.setDate(base.getDate()-((base.getDay()+6)%7));
  const wd=["一","二","三","四","五","六","日"];const t=todayStr();
  const week=wd.map((w,i)=>{const d=new Date(base);d.setDate(base.getDate()+i);const ds=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
    const es=ev.filter(e=>e.at.slice(0,10)===ds);
    return `<div class="day ${ds===t?"today":""}" title="${esc(es.map(e=>e.at.slice(11,16)+" "+e.app.company+" "+e.type).join("\n"))}"><b>${d.getDate()}</b><span>周${w}</span><div class="dots">${es.slice(0,4).map(e=>`<i class="${e.clash?"clash":""}"></i>`).join("")}</div></div>`}).join("");
  const weekN=ev.filter(e=>{const d=new Date(e.at);return d>=base&&d<new Date(base.getTime()+7*864e5)}).length;
  return `<section class="bento">
    <div class="tile t-kpi"><div class="row"><span class="icon">${ICON.send}</span><span class="lbl">投递</span></div><div class="big">${n}</div></div>
    <div class="tile t-kpi sage"><div class="row"><span class="icon">${ICON.chat}</span><span class="lbl">进入面试</span></div><div class="big">${inter}<small>${pct(inter,n)}</small></div></div>
    <div class="tile t-kpi lime"><div class="row"><span class="icon">${ICON.star}</span><span class="lbl">Offer</span></div><div class="big">${offer}<small>${pct(offer,n)}</small></div></div>
    <div class="tile t-funnel"><div class="row"><span class="lbl">阶段转化率</span><span class="spacer"></span><span class="sub">柱下方为较上一阶段的转化</span></div><div class="vbars">${funnel}</div></div>
    <div class="tile t-donut"><span class="lbl">当前阶段分布</span><div class="donut-wrap">${donut(byStage.map(x=>({v:x.v,c:x.c})),120,n,"条投递")}<div class="legend">${byStage.filter(x=>x.v).map(x=>`<div class="li"><span>${x.st}</span><b>${Math.round(x.v/(n||1)*100)}%</b><div class="mini"><i style="width:${x.v/(n||1)*100}%;background:${x.c}"></i></div></div>`).join("")}</div></div></div>
    <div class="tile t-week"><div class="row"><span class="lbl">本周笔试 / 面试</span><span class="spacer"></span><span class="chip">${weekN} 场</span></div><div class="week">${week}</div></div>
  </section>`;
}
function renderApps(){
  const stale=S.apps.filter(isStale);
  let h=statsHTML();
  if(stale.length)h+=`<div class="alert"><span class="icon" style="background:transparent;color:inherit">${ICON.bell}</span><span><b>${stale.length}</b> 条投递超过 ${STALE_DAYS} 天没进展：${stale.map(a=>esc(a.company)).join("、")}</span></div>`;
  h+=`<div class="toolbar"><div class="seg" id="viewSeg">${[["list","卡片"],["board","看板"],["cal","日历"]].map(([k,t])=>`<button data-v="${k}" class="${S.view===k?"on":""}">${t}</button>`).join("")}</div><span class="spacer"></span><button class="btn pri" onclick="editApp()">＋ 新增投递</button></div>`;
  if(!S.apps.length)return h+emptyBox("还没有投递记录。点「新增投递」添加第一条。");
  h+=S.view==="board"?boardHTML():S.view==="cal"?calHTML():listHTML();
  return h;
}
function progBar(a){const steps=7;let i=a.stage==="未通过"?Math.max(...(a.history||[]).map(h=>STAGES.indexOf(h)),0):STAGES.indexOf(a.stage);
  const cls=a.stage==="未通过"?"bad":a.stage==="Offer"?"offer":"";
  return `<div class="prog ${cls}" title="${esc(a.stage)}">${Array.from({length:steps},(_,k)=>`<i class="${k<=i?"on":""}"></i>`).join("")}</div>`}
const stageChip=a=>`<span class="chip ${a.stage==="未通过"?"bad":a.stage==="Offer"?"good":"stage"}">${esc(a.stage)}</span>`;
function listHTML(){
  return `<div class="cards">${[...S.apps].sort((a,b)=>(b.appliedAt||"").localeCompare(a.appliedAt||"")).map(a=>`<article class="acard ${isStale(a)?"stale":""}">
    <div class="ahead"><span class="avatar">${avatarOf(a.company)}</span><div style="min-width:0;flex:1"><div class="co">${esc(a.company)} ${exChip(a)}</div><div class="sub">${esc(a.role)} · ${esc(a.city)}</div></div>${stageChip(a)}</div>
    ${progBar(a)}
    <div class="row sub"><span>${esc(a.channel)}</span><span>·</span><span class="mono">${esc(a.appliedAt)} 投递</span>${staleChip(a)}</div>
    ${a.nextStep?`<div class="nextbox"><span class="icon" style="width:26px;height:26px">${ICON.clock}</span><span style="min-width:0">${nextHTML(a)}</span></div>`:""}
    ${a.notes?`<div class="sub">${esc(a.notes)}</div>`:""}
    <div class="acts"><button class="btn sm" onclick="editApp('${a.id}')">编辑</button><button class="btn sm" onclick="showCoReviews('${a.id}')">复盘 ${rvCount(a)}</button></div></article>`).join("")}</div>`;
}

function boardHTML(){
  return `<div class="board">${STAGES.map(st=>{const list=S.apps.filter(a=>a.stage===st);
    return `<div class="col" data-stage="${st}" ondragover="event.preventDefault();this.classList.add('over')" ondragleave="this.classList.remove('over')" ondrop="dropCard(event,'${st}')"><h3><span>${st==="Offer"?"Offer":st}</span><span>${list.length}</span></h3>${list.map(cardHTML).join("")}</div>`}).join("")}</div>
  <p class="note">拖动卡片到其他列即可改阶段；手机上用卡片里的「下一阶段 →」。</p>`;
}
function cardHTML(a){
  const i=STAGES.indexOf(a.stage);const canNext=i<6;
  return `<div class="card ${isStale(a)?"stale":""}" draggable="true" ondragstart="event.dataTransfer.setData('text/plain','${a.id}')">
    <div><div class="co">${esc(a.company)} ${exChip(a)}</div><div class="sub">${esc(a.role)} · ${esc(a.city)}</div></div>
    ${progBar(a)}<div class="next">${nextHTML(a)}</div>${staleChip(a)}
    <div class="acts">${canNext?`<button class="btn sm" onclick="moveStage('${a.id}','${STAGES[i+1]}')">下一阶段 →</button>`:""}<button class="btn sm" onclick="showCoReviews('${a.id}')">复盘 ${rvCount(a)}</button><button class="btn sm" onclick="editApp('${a.id}')">编辑</button></div></div>`;
}
window.dropCard=(e,st)=>{e.preventDefault();e.currentTarget.classList.remove("over");moveStage(e.dataTransfer.getData("text/plain"),st)};
window.moveStage=(id,st)=>{const a=S.apps.find(x=>x.id===id);if(!a||a.stage===st)return;const o=structuredClone(a);o.history=[...(o.history||[]),o.stage];o.stage=st;o.progressAt=todayStr();save("apps",o)};

/* calendar */
function allEvents(){const ev=[];S.apps.forEach(a=>(a.events||[]).forEach((e,i)=>{if(e.at)ev.push({...e,app:a,key:a.id+i,start:new Date(e.at),end:new Date(new Date(e.at).getTime()+(+e.dur||60)*6e4)})}));
  ev.forEach(x=>x.clash=ev.some(y=>y!==x&&x.start<y.end&&y.start<x.end));return ev}
function calHTML(){
  if(!S.calMonth){const d=new Date();S.calMonth=[d.getFullYear(),d.getMonth()]}
  const[y,m]=S.calMonth;const first=new Date(y,m,1);const start=new Date(y,m,1-((first.getDay()+6)%7));
  const ev=allEvents();const tStr=todayStr();const now=new Date();let cells="";
  const dstr=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);const ds=dstr(d);
    const day=ev.filter(e=>e.at.slice(0,10)===ds);
    const cls=[d.getMonth()!==m?"out":"",ds===tStr?"today":"",day.some(e=>e.clash)?"clash":day.length?(ds<tStr?"past":"up"):"",S.calSel===ds?"sel":""].join(" ");
    cells+=`<button class="dc ${cls}" onclick="S.calSel=S.calSel==='${ds}'?null:'${ds}';render()" title="${esc(day.map(e=>e.at.slice(11,16)+" "+e.app.company+" "+e.type).join("\n"))}">${d.getDate()}${day.length>1?`<span class="n">${day.length}</span>`:""}</button>`;
    if(i===34&&new Date(start.getTime()+35*864e5).getMonth()!==m)break;}
  const list=(S.calSel?ev.filter(e=>e.at.slice(0,10)===S.calSel):ev.filter(e=>e.end>=now)).sort((a,b)=>a.start-b.start);
  const clashN=ev.filter(e=>e.end>=now&&e.clash).length;
  const title=S.calSel?`${+S.calSel.slice(5,7)} 月 ${+S.calSel.slice(8)} 日`:"接下来的安排";
  return `${clashN?`<div class="alert badc" style="margin:0 0 12px">有 ${clashN} 场笔试 / 面试时间重叠，日历上标红。</div>`:""}
  <div class="calgrid"><div class="calbox"><div class="cal-head"><b>${y} 年 ${m+1} 月</b><button class="btn sm" onclick="calShift(-1)" aria-label="上个月">←</button><button class="btn sm" onclick="S.calMonth=null;S.calSel=null;render()">本月</button><button class="btn sm" onclick="calShift(1)" aria-label="下个月">→</button></div>
  <div class="cal">${["一","二","三","四","五","六","日"].map(d=>`<div class="dow">${d}</div>`).join("")}${cells}</div>
  <div class="calleg"><span><i style="box-shadow:inset 0 0 0 1.5px var(--on-night)"></i>今天</span><span><i style="background:var(--lime)"></i>待参加</span><span><i style="background:var(--night-2)"></i>已结束</span><span><i style="background:var(--bad)"></i>时间冲突</span></div></div>
  <div class="meet"><h3>${title}<span class="chip">${list.length}</span>${S.calSel?`<span class="spacer"></span><button class="btn sm" onclick="S.calSel=null;render()">看全部</button>`:""}</h3>
  ${list.length?list.map(e=>`<div class="mrow ${e.clash?"clash":""}" onclick="editApp('${e.app.id}')"><div class="t">${e.at.slice(11,16)}<small>${+e.at.slice(5,7)}/${+e.at.slice(8,10)} · ${e.dur||60} 分钟</small></div><div style="min-width:0"><b>${esc(e.app.company)}</b><div class="sub">${esc(e.app.role)}</div></div><span class="chip ${e.clash?"bad":"stage"}">${esc(e.type)}</span></div>`).join(""):`<span class="sub">${S.calSel?"这天没有安排。":"暂无。在投递里添加笔试 / 面试时间即可显示。"}</span>`}</div></div>`;
}
window.calShift=d=>{S.calSel=null;let[y,m]=S.calMonth;m+=d;if(m<0){m=11;y--}if(m>11){m=0;y++}S.calMonth=[y,m];render()};

/* app modal */
let draft=null;
function openModal(html){$("#modalRoot").innerHTML=`<div class="mask" onclick="if(event.target===this)closeModal()"><div class="modal" role="dialog">${html}</div></div>`}
window.closeModal=()=>{$("#modalRoot").innerHTML="";draft=null};
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal()});
const opt=(arr,v)=>arr.map(x=>`<option ${x===v?"selected":""}>${x}</option>`).join("");
window.editApp=id=>{
  const a=id?structuredClone(S.apps.find(x=>x.id===id)):{id:newId("app"),company:"",role:"",city:"",channel:"官网",appliedAt:todayStr(),stage:"已投递",nextStep:"",nextAt:"",notes:"",events:[],history:[],progressAt:todayStr()};
  draft=a;drawAppModal(!id);
};
function drawAppModal(isNew){
  const a=draft;
  openModal(`<h2>${isNew?"新增投递":"编辑投递"}</h2>
  <div class="grid2">
    <label class="f">公司<input id="f_company" value="${esc(a.company)}"></label>
    <label class="f">岗位<input id="f_role" value="${esc(a.role)}"></label>
    <label class="f">城市<input id="f_city" value="${esc(a.city)}"></label>
    <label class="f">投递渠道<select id="f_channel">${opt(CHANNELS,a.channel)}</select></label>
    <label class="f">投递日期<input type="date" id="f_appliedAt" value="${esc(a.appliedAt)}"></label>
    <label class="f">阶段<select id="f_stage">${opt(STAGES,a.stage)}</select></label>
    <label class="f">下一步事项<input id="f_nextStep" value="${esc(a.nextStep)}"></label>
    <label class="f">下一步时间<input type="datetime-local" id="f_nextAt" value="${esc(a.nextAt)}"></label>
    <label class="f full">备注<textarea id="f_notes">${esc(a.notes)}</textarea></label>
  </div>
  <div><div class="row" style="justify-content:space-between"><b>笔试 / 面试安排</b><button class="btn sm" onclick="syncApp();draft.events.push({type:'一面',at:'',dur:60});drawAppModal(${isNew})">＋ 添加</button></div>
  <div class="sublist" style="margin-top:8px">${(a.events||[]).map((e,i)=>`<div class="row"><select id="ev_t${i}" class="btn sm">${opt(EVTYPES,e.type)}</select><input type="datetime-local" id="ev_a${i}" value="${esc(e.at)}" class="btn sm"><input type="number" id="ev_d${i}" value="${e.dur||60}" min="10" step="10" class="btn sm" style="width:72px"><span class="sub">分钟</span><button class="btn sm del" onclick="syncApp();draft.events.splice(${i},1);drawAppModal(${isNew})">删除</button></div>`).join("")||`<span class="sub">还没有安排。</span>`}</div></div>
  <div class="row">${isNew?"":`<button class="btn del" id="delBtn" onclick="confirmDel('apps','${a.id}',this)">删除</button>`}<span class="spacer"></span><button class="btn" onclick="closeModal()">取消</button><button class="btn pri" onclick="commitApp()">保存</button></div>`);
}
window.syncApp=()=>{const a=draft;["company","role","city","channel","appliedAt","stage","nextStep","nextAt","notes"].forEach(k=>{const el=$("#f_"+k);if(el)a[k]=el.value.trim()});
  (a.events||[]).forEach((e,i)=>{if($("#ev_t"+i)){e.type=$("#ev_t"+i).value;e.at=$("#ev_a"+i).value;e.dur=+$("#ev_d"+i).value||60}})};
window.commitApp=()=>{syncApp();const a=draft;if(!a.company){toast("请填写公司");return}
  const old=S.apps.find(x=>x.id===a.id);
  if(old&&old.stage!==a.stage){a.history=[...(a.history||[]),old.stage];a.progressAt=todayStr()}
  else if(old&&(old.nextStep!==a.nextStep||old.nextAt!==a.nextAt||JSON.stringify(old.events)!==JSON.stringify(a.events)))a.progressAt=todayStr();
  delete a.example;save("apps",a);closeModal()};
window.confirmDel=(c,id,btn)=>{if(btn.dataset.sure){remove(c,id);closeModal()}else{btn.dataset.sure=1;btn.textContent="再点一次确认删除"}};

/* reviews for one company */
window.showCoReviews=id=>{const a=S.apps.find(x=>x.id===id);const ids=S.apps.filter(x=>x.company===a.company).map(x=>x.id);
  const list=S.reviews.filter(r=>ids.includes(r.appId)).sort((x,y)=>(y.date||"").localeCompare(x.date||""));
  openModal(`<div class="row"><h2>${esc(a.company)} 的复盘</h2><span class="spacer"></span><button class="btn sm pri" onclick="editReview(null,'${a.id}')">＋ 写复盘</button><button class="btn sm" onclick="closeModal()">关闭</button></div>
  <div class="rv-list">${list.length?list.map(r=>reviewHTML(r,true)).join(""):emptyBox("这家公司还没有复盘。")}</div>`)};

/* ---------- reviews ---------- */
function reviewHTML(r,compact){
  const a=S.apps.find(x=>x.id===r.appId);
  const qs=(r.questions||[]).filter(q=>!S.rvType||compact||q.type===S.rvType);
  const all=r.questions||[];const QC={"专业题":"var(--ink)","行为题":"var(--sage-deep)","案例题":"var(--lime)","背景题":"var(--sage)"};
  const weakN=all.filter(q=>q.weak).length;
  return `<article class="rv"><div class="ahead"><span class="avatar">${avatarOf(a?.company)}</span><div style="flex:1;min-width:0"><b>${esc(a?.company||"已删除")}</b><div class="sub">${esc(a?.role||"")}</div></div><span class="chip stage">${esc(r.round)}</span></div>
  <div class="row sub"><span class="mono">${esc(r.date)}</span><span>· ${all.length} 题</span>${weakN?`<span class="chip bad">${weakN} 处没答好</span>`:`<span class="chip good">都答上了</span>`}</div>
  <div class="qmix">${all.map(q=>`<i style="flex:1;background:${QC[q.type]||"var(--sunk)"}" title="${esc(q.type)}"></i>`).join("")}</div>
  ${qs.map(q=>`<div class="q"><div><span class="chip">${esc(q.type)}</span> <b>${esc(q.q)}</b></div>${q.answer?`<div><span class="qlbl">回答要点</span> ${esc(q.answer)}</div>`:""}${q.weak?`<div class="weak"><span class="qlbl">没答好</span> ${esc(q.weak)}</div>`:""}</div>`).join("")}
  ${r.improve?`<div class="improve"><b>下次改进</b><br>${esc(r.improve)}</div>`:""}${compact?"":`<div class="acts"><button class="btn sm" onclick="editReview('${r.id}')">编辑</button></div>`}</article>`;
}
function renderReviews(){
  const cos=[...new Set(S.apps.map(a=>a.company))];
  let list=S.reviews.filter(r=>{const a=S.apps.find(x=>x.id===r.appId);if(S.rvCo&&a?.company!==S.rvCo)return false;if(S.rvType&&!(r.questions||[]).some(q=>q.type===S.rvType))return false;return true}).sort((x,y)=>(y.date||"").localeCompare(x.date||""));
  return `<div class="toolbar"><select class="btn" id="rvCo" onchange="S.rvCo=this.value;render()"><option value="">全部公司</option>${cos.map(c=>`<option ${c===S.rvCo?"selected":""}>${esc(c)}</option>`).join("")}</select>
  <div class="seg">${["",...QTYPES].map(t=>`<button class="${S.rvType===t?"on":""}" onclick="S.rvType='${t}';render()">${t||"全部题型"}</button>`).join("")}</div>
  <span class="spacer"></span><button class="btn pri" onclick="editReview()" ${S.apps.length?"":"disabled"}>＋ 写复盘</button></div>
  <div class="rv-list">${list.length?list.map(r=>reviewHTML(r)).join(""):emptyBox(S.reviews.length?"没有符合筛选的复盘。":"还没有复盘。面试结束后点「写复盘」，关联到对应的投递。")}</div>`;
}
window.editReview=(id,appId)=>{
  draft=id?structuredClone(S.reviews.find(r=>r.id===id)):{id:newId("rv"),appId:appId||S.apps[0]?.id||"",round:"一面",date:todayStr(),questions:[{type:"专业题",q:"",answer:"",weak:""}],improve:""};
  drawReview(!id)};
function drawReview(isNew){const r=draft;
  openModal(`<h2>${isNew?"写复盘":"编辑复盘"}</h2><div class="grid2">
  <label class="f full">关联投递<select id="r_app">${S.apps.map(a=>`<option value="${a.id}" ${a.id===r.appId?"selected":""}>${esc(appLabel(a))}</option>`).join("")}</select></label>
  <label class="f">轮次<select id="r_round">${opt(["笔试","一面","二面","三面","HR 面","其他"],r.round)}</select></label>
  <label class="f">日期<input type="date" id="r_date" value="${esc(r.date)}"></label></div>
  <div class="row" style="justify-content:space-between"><b>被问到的问题</b><button class="btn sm" onclick="syncRv();draft.questions.push({type:'专业题',q:'',answer:'',weak:''});drawReview(${isNew})">＋ 添加问题</button></div>
  <div class="sublist">${r.questions.map((q,i)=>`<div class="subitem"><div class="row"><select id="q_t${i}" class="btn sm">${opt(QTYPES,q.type)}</select><span class="spacer"></span><button class="btn sm del" onclick="syncRv();draft.questions.splice(${i},1);drawReview(${isNew})">删除</button></div>
   <label class="f">问题<input id="q_q${i}" value="${esc(q.q)}"></label><label class="f">我的回答要点<textarea id="q_a${i}">${esc(q.answer)}</textarea></label><label class="f">没答好的地方<textarea id="q_w${i}">${esc(q.weak)}</textarea></label></div>`).join("")}</div>
  <label class="f">下一次改进点<textarea id="r_improve">${esc(r.improve)}</textarea></label>
  <div class="row">${isNew?"":`<button class="btn del" onclick="confirmDel('reviews','${r.id}',this)">删除</button>`}<span class="spacer"></span><button class="btn" onclick="closeModal()">取消</button><button class="btn pri" onclick="commitRv()">保存</button></div>`)}
window.syncRv=()=>{const r=draft;r.appId=$("#r_app").value;r.round=$("#r_round").value;r.date=$("#r_date").value;r.improve=$("#r_improve").value.trim();
  r.questions.forEach((q,i)=>{q.type=$("#q_t"+i).value;q.q=$("#q_q"+i).value.trim();q.answer=$("#q_a"+i).value.trim();q.weak=$("#q_w"+i).value.trim()})};
window.commitRv=()=>{syncRv();if(!draft.appId){toast("先添加一条投递");return}delete draft.example;save("reviews",draft);closeModal()};

/* ---------- offers ---------- */
const CUR={SGD:"S$",CNY:"¥",USD:"$"};
function offerCalc(o){
  const base=(+o.monthly||0)*(+o.months||0);
  const fund=o.currency==="CNY"?(+o.monthly||0)*((+o.fundPct||0)/100)*12*2:(+o.monthly||0)*((+o.fundPct||0)/100)*12;
  const total=base+(+o.extraCash||0);
  const score=Math.round(((+o.growth||0)*0.4+(6-(+o.intensity||3))*0.3+(+o.fit||0)*0.3)*20);
  return{base,fund,total,score};
}
const money=(v,c)=>(CUR[c]||"")+Math.round(v).toLocaleString();
function renderOffers(){
  const rows=S.offers.map(o=>({o,c:offerCalc(o)}));
  const best=rows.length>1?rows.reduce((a,b)=>b.c.score>a.c.score?b:a).o.id:null;
  const pips=(v,lbl)=>`<div class="meter"><span>${lbl}</span><div class="pips">${[1,2,3,4,5].map(k=>`<i class="${k<=v?"on":""}"></i>`).join("")}</div></div>`;
  return `<div class="toolbar"><b style="font-size:16px">Offer 对比</b><span class="spacer"></span><button class="btn pri" onclick="editOffer()">＋ 新增 Offer</button></div>
  ${rows.length?`<div class="ocards">${rows.sort((a,b)=>b.c.score-a.c.score).map(({o,c})=>`<article class="ocard ${o.id===best?"best":""}">
    <div class="ahead"><div style="flex:1;min-width:0"><div class="co" style="font-size:16px">${esc(o.company)}</div><div class="sub">${esc(o.role)} · ${esc(o.city)}</div>${o.id===best?'<span class="chip" style="background:var(--ink);color:var(--on-ink);margin-top:6px">综合分最高</span>':""}</div>
      <div style="color:inherit">${donut([{v:c.score,c:o.id===best?"#16181a":"var(--ink)"},{v:100-c.score,c:"transparent"}],64,c.score)}</div></div>
    <div><div class="lbl">年包（现金）</div><div class="big" style="font-size:32px">${money(c.total,o.currency)}</div><div class="sub">${money(o.monthly,o.currency)} × ${esc(o.months)} 个月${+o.extraCash?` + 其他 ${money(o.extraCash,o.currency)}`:""}</div></div>
    <div class="kv"><div><span class="lbl">${o.currency==="CNY"?"公积金":"公积金 / CPF"}</span><b>${esc(o.fundPct)}%</b><span class="sub">约 ${money(c.fund,o.currency)}/年</span></div><div><span class="lbl">月薪</span><b>${money(o.monthly,o.currency)}</b><span class="sub">${esc(o.currency)}</span></div></div>
    <div style="display:flex;flex-direction:column;gap:6px">${pips(+o.growth||0,"成长空间")}${pips(+o.intensity||0,"工作强度")}${pips(+o.fit||0,"匹配度")}</div>
    ${o.perks?`<div class="sub">${esc(o.perks)}</div>`:""}
    <div class="acts"><button class="btn sm" onclick="editOffer('${o.id}')">编辑</button></div></article>`).join("")}</div>
  <p class="note">年包 = 月薪 × 月数 + 签字费/其他现金。公积金按人民币口径计个人+公司两份，新加坡 CPF 只计公司部分。综合分（满分 100）= 成长空间 40% + 工作强度（越低越好）30% + 匹配度 30%。不同币种的年包不直接比较。</p>`
  :emptyBox("还没有 Offer。拿到后点「新增 Offer」记录。")}`;
}
window.editOffer=id=>{const o=id?structuredClone(S.offers.find(x=>x.id===id)):{id:newId("of"),company:"",role:"",city:"",currency:"SGD",monthly:"",months:13,fundPct:17,extraCash:0,intensity:3,growth:3,fit:3,perks:""};
  draft=o;
  openModal(`<h2>${id?"编辑 Offer":"新增 Offer"}</h2><div class="grid2">
  <label class="f">公司<input id="o_company" value="${esc(o.company)}"></label><label class="f">岗位<input id="o_role" value="${esc(o.role)}"></label>
  <label class="f">城市<input id="o_city" value="${esc(o.city)}"></label><label class="f">币种<select id="o_currency">${opt(["SGD","CNY","USD"],o.currency)}</select></label>
  <label class="f">月薪<input type="number" id="o_monthly" value="${esc(o.monthly)}"></label><label class="f">月数<input type="number" step="0.5" id="o_months" value="${esc(o.months)}"></label>
  <label class="f">公积金 / CPF 比例 %<input type="number" step="0.5" id="o_fundPct" value="${esc(o.fundPct)}"></label><label class="f">签字费 / 其他现金（年）<input type="number" id="o_extraCash" value="${esc(o.extraCash)}"></label>
  <label class="f">工作强度 1–5（5 最累）<input type="number" min="1" max="5" id="o_intensity" value="${esc(o.intensity)}"></label><label class="f">成长空间 1–5<input type="number" min="1" max="5" id="o_growth" value="${esc(o.growth)}"></label>
  <label class="f">个人匹配度 1–5<input type="number" min="1" max="5" id="o_fit" value="${esc(o.fit)}"></label>
  <label class="f full">其他福利<textarea id="o_perks">${esc(o.perks)}</textarea></label></div>
  <div class="row">${id?`<button class="btn del" onclick="confirmDel('offers','${o.id}',this)">删除</button>`:""}<span class="spacer"></span><button class="btn" onclick="closeModal()">取消</button><button class="btn pri" onclick="commitOffer()">保存</button></div>`)};
window.commitOffer=()=>{const o=draft;["company","role","city","currency","monthly","months","fundPct","extraCash","intensity","growth","fit","perks"].forEach(k=>o[k]=$("#o_"+k).value.trim());
  ["intensity","growth","fit"].forEach(k=>o[k]=Math.min(5,Math.max(1,+o[k]||3)));if(!o.company){toast("请填写公司");return}delete o.example;save("offers",o);closeModal()};
</script>
